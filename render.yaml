services:
  - type: web
    name: jenga-ai-api
    runtime: python
    rootDir: .
    plan: free
    buildCommand: pip install -r backend/requirements.txt && prisma generate --schema backend/prisma/schema.prisma
    startCommand: cd backend && prisma db push && uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "10080"
      - key: GEMINI_API_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: PYTHON_VERSION
        value: "3.13.4"