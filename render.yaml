services:
  - type: web
    name: jenga-ai
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt && prisma generate --schema prisma/schema.prisma && prisma py fetch
    startCommand: prisma migrate deploy --schema prisma/schema.prisma && exec uvicorn main:app --host 0.0.0.0 --port "$PORT"
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "10080"
      - key: GEMINI_API_KEY
        sync: false
      - key: FRONTEND_URL
        value: "https://rat-ochre.vercel.app,https://jenga-ai-yfdo.vercel.app"
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: PRISMA_BINARY_CACHE_DIR
        value: ".prisma-cache"
